<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Breaking Rice</title><meta name="robots" content="noindex">
<style>body{background:#070d07;color:#e9f5e1;font:15px system-ui;margin:0;padding:16px;max-width:900px;margin:auto}
input,textarea,select,button{font:inherit;padding:8px;border-radius:6px;border:1px solid #2d6a1f;background:#101a10;color:#e9f5e1;width:100%;margin:4px 0}
button{background:#7cf03a;color:#031003;font-weight:700;cursor:pointer;width:auto;padding:8px 16px;border:0}button.d{background:#c0392b;color:#fff}button.g{background:#2d6a1f;color:#fff}
.box{background:#101a10;border:1px solid #2d6a1f;border-radius:8px;padding:14px;margin:12px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #1d3a18;padding:8px 0}
.row img{width:44px;height:44px;object-fit:cover;border-radius:4px}label{display:block;font-size:.85rem;opacity:.8;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{display:flex;gap:8px;margin:12px 0}h1{color:#7cf03a}input,textarea,select{font-size:16px}
summary{cursor:pointer;list-style:none;font-weight:700;color:#7cf03a;display:flex;justify-content:space-between}summary::-webkit-details-marker{display:none}summary:after{content:"+";font-size:1.3rem;line-height:1}details[open]>summary:after{content:"−"}details.box>summary+*{margin-top:10px}
details.sub{border-top:1px solid #1d3a18;padding:8px 0}details.sub>summary{color:#f2c94c;font-size:.95rem}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#7cf03a88;border-radius:10px}
@media(max-width:600px){body{padding:10px}.two{grid-template-columns:1fr}.row{flex-direction:column;align-items:flex-start}.row>div:last-child{width:100%;display:flex;gap:8px}nav{flex-wrap:wrap}nav button{flex:1}h1{font-size:1.4rem}}</style></head><body>
<h1>Breaking Rice — Admin</h1><div id="app"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=sessionStorage.t,items=[],S={},ST=[],tab='menu';const OP=new Set(['stats']);
const api=async(m,u,b)=>{const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});if(r.status==401&&u!=='login'){delete sessionStorage.t;T=null;return render()}const j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j};
const img=f=>new Promise(res=>{if(!f)return res('');const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.src=r.result};r.readAsDataURL(f)});
const acc=(id,t,h)=>`<details class=box id="a_${id}" data-k="${id}" ${OP.has(id)?'open':''}><summary>${t}</summary><div>${h}</div></details>`;
document.addEventListener('toggle',e=>{const d=e.target,k=d.dataset&&d.dataset.k;if(k)d.open?OP.add(k):OP.delete(k)},true);
async function render(){const a=$('#app');
 if(!T){a.innerHTML='<div class="box"><input id=pw type=password placeholder="Mot de passe"><button id=go>Connexion</button> <span id=er style="color:#f66"></span></div>';
  $('#go').onclick=async()=>{try{T=sessionStorage.t=(await api('POST','login',{password:$('#pw').value})).token;render()}catch(e){$('#er').textContent=e.message}};return}
 items=await api('GET','admin/items');S=await api('GET','admin/settings');try{ST=await api('GET','admin/stats')}catch{ST=[]}
 a.innerHTML=`<nav><button class="${tab=='menu'?'':'g'}" onclick="tab='menu';render()">Menu</button><button class="${tab=='set'?'':'g'}" onclick="tab='set';render()">Réglages</button><button class="${tab=='st'?'':'g'}" onclick="tab='st';render()">Stats</button><button class="d" onclick="delete sessionStorage.t;T=null;render()">Déconnexion</button></nav><div id=c></div>`;
 tab=='menu'?menu():tab=='st'?stats():set()}
function stats(){const mx=Math.max(1,...ST.map(d=>Math.max(d.views,d.orders))),t=k=>ST.reduce((a,d)=>a+d[k],0);
 $('#c').innerHTML=acc('stats','Statistiques — 14 derniers jours',`<p><b>${t('views')}</b> visites · <b>${t('orders')}</b> clics « Commander »</p><div style="display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:10px">${ST.map(d=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;height:100%" title="${d.day} : ${d.views} visites, ${d.orders} clics"><div style="width:100%;background:#7cf03a;height:${d.views/mx*42}%"></div><div style="width:100%;background:#f2c94c;height:${d.orders/mx*42}%"></div><small>${d.day.slice(8)}</small></div>`).join('')}</div><small><span style="color:#7cf03a">■</span> visites · <span style="color:#f2c94c">■</span> clics « Commander »</small>`)}
function menu(){$('#c').innerHTML=acc('form','Ajouter / modifier un plat',`<input type=hidden id=id><div class=two><div><label>Nom</label><input id=n></div><div><label>Prix (€)</label><input id=p type=number step=.1></div></div>
<label>Catégorie</label><select id=cat>${S.categories.map(c=>`<option>${E(c)}</option>`).join('')}</select><label>Description</label><textarea id=d rows=2></textarea>
<div class=two><div><label>Allergènes</label><input id=al></div><div><label>Badge (ex : Nouveau)</label><input id=tg></div></div>
<div class=two><label><input type=checkbox id=hl checked style="width:auto"> Halal (badge)</label><label><input type=checkbox id=fi style="width:auto"> Promo Fitness Park (healthy)</label></div><details class=sub data-k="tr"><summary>Traductions EN / ES / RU (facultatif)</summary><label>Nom (EN)</label><input id=ne><label>Description (EN)</label><textarea id=de rows=2></textarea><label>Nom (ES)</label><input id=ns><label>Description (ES)</label><textarea id=ds rows=2></textarea><label>Nom (RU)</label><input id=nr><label>Description (RU)</label><textarea id=dr2 rows=2></textarea></details><label>Photo : lien (conseillé, ex. /img/box.jpg ou https://…)</label><input id=pu placeholder="/img/nom.jpg"><small id=pn></small><label>… ou importer un fichier (stocké dans MongoDB)</label><input id=ph type=file accept="image/*">
<label><input type=checkbox id=av checked style="width:auto"> Disponible</label><button id=sv>Enregistrer</button> <button class=g onclick="menu()">Vider</button>`)
 +acc('list',`Liste des plats (${items.length})`,`<input id=fs placeholder="Filtrer (nom, catégorie)…"><div id=lst></div>`);
 const row=i=>`<div class=row><div style="display:flex;gap:10px;align-items:center">${i.photo?`<img src="${E(i.photo)}">`:''}<div><b>${E(i.name)}</b> — ${(+i.price).toFixed(2)} €${i.available?'':'<br><small>masqué</small>'}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class=g onclick="mv('${i._id}',-1)">▲</button><button class=g onclick="mv('${i._id}',1)">▼</button><button class=g onclick="tgl('${i._id}')">${i.available?'Masquer':'Afficher'}</button><button class=g onclick="dup('${i._id}')">Dupliquer</button><button class=g onclick="edit('${i._id}')">Éditer</button><button class=d onclick="del('${i._id}')">X</button></div></div>`;
 const lst=(f='')=>{const g={};items.filter(i=>(i.name+' '+i.category).toLowerCase().includes(f)).forEach(i=>(g[i.category]=g[i.category]||[]).push(i));
  $('#lst').innerHTML=Object.keys(g).map(c=>`<details class=sub data-k="c:${E(c)}" ${f||OP.has('c:'+c)?'open':''}><summary>${E(c)} (${g[c].length})</summary>${g[c].map(row).join('')}</details>`).join('')||'<small>Aucun plat</small>'};
 lst();$('#fs').oninput=e=>lst(e.target.value.toLowerCase());
 $('#sv').onclick=async()=>{const o={name:$('#n').value,price:+$('#p').value,category:$('#cat').value,description:$('#d').value,allergens:$('#al').value,tag:$('#tg').value,halal:$('#hl').checked,fitness:$('#fi').checked,name_en:$('#ne').value,name_es:$('#ns').value,description_en:$('#de').value,description_es:$('#ds').value,name_ru:$('#nr').value,description_ru:$('#dr2').value,available:$('#av').checked},f=$('#ph').files[0],u=$('#pu').value.trim(),id=$('#id').value,cur=items.find(x=>x._id==id);
  if(f)o.photo=await img(f);else if(u)o.photo=u;else if(!cur||!(cur.photo||'').startsWith('data:'))o.photo='';
  await api(id?'PUT':'POST','admin/items'+(id?'/'+id:''),o);render()}}
window.mv=async(id,d)=>{const k=items.findIndex(x=>x._id==id),c=items[k].category;let j=k+d;while(j>=0&&j<items.length&&items[j].category!=c)j+=d;if(j<0||j>=items.length)return;[items[k],items[j]]=[items[j],items[k]];await api('POST','admin/reorder',{ids:items.map(x=>x._id)});render()};
window.tgl=async id=>{const i=items.find(x=>x._id==id);await api('PUT','admin/items/'+id,{available:!i.available});render()};
window.dup=async id=>{const{_id,__v,...i}=items.find(x=>x._id==id);i.name+=' (copie)';await api('POST','admin/items',i);render()};
window.edit=id=>{const i=items.find(x=>x._id==id),d=(i.photo||'').startsWith('data:');$('#a_form').open=true;$('#id').value=id;$('#n').value=i.name;$('#p').value=i.price;$('#cat').value=i.category;$('#d').value=i.description||'';$('#al').value=i.allergens||'';$('#tg').value=i.tag||'';$('#av').checked=i.available;$('#hl').checked=!!i.halal;$('#fi').checked=!!i.fitness;$('#ne').value=i.name_en||'';$('#de').value=i.description_en||'';$('#ns').value=i.name_es||'';$('#ds').value=i.description_es||'';$('#nr').value=i.name_ru||'';$('#dr2').value=i.description_ru||'';$('#pu').value=d?'':(i.photo||'');$('#pn').textContent=d?'Photo importée conservée (laissez vide pour la garder)':'';$('#a_form').scrollIntoView()};
window.del=async id=>{if(confirm('Supprimer ?')){await api('DELETE','admin/items/'+id);render()}};
const DJ=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'],slug=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'page';
const col=()=>({...S,popup:{...S.popup,enabled:$('#pe').checked,title:$('#pt').value,text:$('#px').value,image:$('#pl').value.trim()||((S.popup.image||'').startsWith('data:')?S.popup.image:'')},banner:{enabled:$('#be').checked,text:$('#bt').value},uberUrl:$('#u').value,about:$('#ab').value,about_en:$('#abe').value,about_es:$('#abs').value,about_ru:$('#abr').value,fitness:{enabled:$('#fe').checked,title:$('#ft').value,price:$('#fpx').value,text:$('#fx').value,cond:$('#fc').value,title_en:$('#fte').value,text_en:$('#fxe').value,cond_en:$('#fce').value,title_es:$('#fts').value,text_es:$('#fxs').value,cond_es:$('#fcs').value,title_ru:$('#ftr').value,text_ru:$('#fxr').value,cond_ru:$('#fcr').value},address:$('#ad').value,phone:$('#tl').value,lat:parseFloat($('#la').value)||null,lng:parseFloat($('#ln').value)||null,categories:$('#ct').value.split(',').map(x=>x.trim()).filter(Boolean),socials:{instagram:$('#s1').value,tiktok:$('#s2').value,snapchat:$('#s3').value,facebook:$('#s4').value},faq:[...document.querySelectorAll('.fq')].map(x=>({q:x.querySelector('.q1').value,a:x.querySelector('.a1').value,q_en:x.querySelector('.qe').value,a_en:x.querySelector('.ae').value,q_es:x.querySelector('.qs2').value,a_es:x.querySelector('.as2').value,q_ru:x.querySelector('.qr').value,a_ru:x.querySelector('.ar').value})),schedule:[...document.querySelectorAll('.sc')].map(x=>x.value),pages:[...document.querySelectorAll('.pg')].map(q=>({title:q.querySelector('.t2').value,slug:slug(q.querySelector('.t2').value),text:q.querySelector('.x2').value,show:q.querySelector('.v2').checked})),google:{url:$('#gu').value.trim(),placeId:$('#gp').value.trim(),rating:parseFloat($('#gr').value)||0,count:+$('#gc').value||0,reviews:[...document.querySelectorAll('.rw')].map(x=>({name:x.querySelector('.n3').value,rating:+x.querySelector('.r3').value||5,text:x.querySelector('.t3').value,date:x.querySelector('.d3').value,show:x.querySelector('.s3').checked}))}});
function set(){const p=S.popup,b=S.banner,sc=S.schedule||[],g=S.google||{},so=S.socials||{},fi=S.fitness||{},pd=(p.image||'').startsWith('data:');
 $('#c').innerHTML=acc('pop','Popup (avertissement / promo)',`<label><input type=checkbox id=pe style="width:auto" ${p.enabled?'checked':''}> Activer</label><input id=pt placeholder="Titre" value="${E(p.title)}"><textarea id=px rows=3 placeholder="Texte">${E(p.text)}</textarea><label>Image : lien</label><input id=pl value="${pd?'':E(p.image||'')}" placeholder="/img/…"><label>… ou fichier${pd?' (une image importée est conservée si le lien est vide)':''}</label><input id=pi type=file accept="image/*">`)
 +acc('ban','Bandeau promo (haut de page)',`<label><input type=checkbox id=be style="width:auto" ${b.enabled?'checked':''}> Activer</label><input id=bt value="${E(b.text)}">`)
 +acc('fit','Healthy × Fitness Park (promo carte de sport)',`<label><input type=checkbox id=fe style="width:auto" ${fi.enabled?'checked':''}> Afficher le bloc sur le site</label><label>Titre</label><input id=ft value="${E(fi.title)}"><label>Prix abonné (ex : 7 €) — vide = non affiché</label><input id=fpx value="${E(fi.price||'')}"><label>Texte</label><textarea id=fx rows=2>${E(fi.text)}</textarea><label>Condition (Fitness Park obligatoire)</label><textarea id=fc rows=3>${E(fi.cond)}</textarea><details class=sub><summary>Traductions EN / ES</summary><label>Titre (EN)</label><input id=fte value="${E(fi.title_en||'')}"><label>Texte (EN)</label><textarea id=fxe rows=2>${E(fi.text_en||'')}</textarea><label>Condition (EN)</label><textarea id=fce rows=3>${E(fi.cond_en||'')}</textarea><label>Titre (ES)</label><input id=fts value="${E(fi.title_es||'')}"><label>Texte (ES)</label><textarea id=fxs rows=2>${E(fi.text_es||'')}</textarea><label>Condition (ES)</label><textarea id=fcs rows=3>${E(fi.cond_es||'')}</textarea><label>Titre (RU)</label><input id=ftr value="${E(fi.title_ru||'')}"><label>Texte (RU)</label><textarea id=fxr rows=2>${E(fi.text_ru||'')}</textarea><label>Condition (RU)</label><textarea id=fcr rows=3>${E(fi.cond_ru||'')}</textarea></details>`)
 +acc('hor','Horaires',`<small>Format : 11:30-15:00 / 18:00-01:00 (après minuit accepté) ou Fermé</small>${DJ.map((d,i)=>`<label>${d}</label><input class=sc value="${E(sc[i]||'')}">`).join('')}`)
 +acc('inf','Infos du site',`<label>Lien Uber Eats</label><input id=u value="${E(S.uberUrl)}"><label>Texte « La formule » (à propos)</label><textarea id=ab rows=4>${E(S.about)}</textarea><label>Texte « La formule » (EN)</label><textarea id=abe rows=3>${E(S.about_en||'')}</textarea><label>Texte « La formule » (ES)</label><textarea id=abs rows=3>${E(S.about_es||'')}</textarea><label>Texte « La formule » (RU)</label><textarea id=abr rows=3>${E(S.about_ru||'')}</textarea><label>Adresse</label><input id=ad value="${E(S.address)}"><div class=two><div><label>Latitude (carte)</label><input id=la value="${S.lat||''}"></div><div><label>Longitude (carte)</label><input id=ln value="${S.lng||''}"></div></div><small>Laissez vide pour un calcul automatique depuis l'adresse.</small><label>Téléphone</label><input id=tl value="${E(S.phone)}"><label>Catégories du menu (séparées par des virgules)</label><input id=ct value="${E(S.categories.join(', '))}">`)
 +acc('goo','Avis Google',`<small>Si GOOGLE_API_KEY et GOOGLE_PLACE_ID sont définis sur Render, les vrais avis s'affichent automatiquement (vérifiés). Sinon, copiez ici vos meilleurs avis (4★ et 5★ seulement sont affichés).</small><label>Lien Google Maps</label><input id=gu value="${E(g.url||'')}"><label>Place ID (optionnel, pour le bouton « Écrire un avis »)</label><input id=gp value="${E(g.placeId||'')}"><div class=two><div><label>Note moyenne (ex : 4.9)</label><input id=gr value="${g.rating||''}"></div><div><label>Nombre d'avis</label><input id=gc value="${g.count||''}"></div></div>${(g.reviews||[]).map((x,i)=>`<div class=rw style="border-top:1px solid #1d3a18;padding-top:8px;margin-top:8px"><div class=two><input class=n3 placeholder="Nom" value="${E(x.name)}"><input class=r3 type=number min=1 max=5 value="${+x.rating||5}"></div><textarea class=t3 rows=3 placeholder="Texte de l'avis">${E(x.text)}</textarea><input class=d3 placeholder="Date (ex : il y a 2 semaines)" value="${E(x.date||'')}"><label><input type=checkbox class=s3 style="width:auto" ${x.show!==false?'checked':''}> Afficher</label><button class="d dr" data-i=${i}>Supprimer</button></div>`).join('')}<button class=g id=ar>+ Ajouter un avis</button>`)
 +acc('soc','Réseaux sociaux (liens complets https://…, vide = masqué)',`<label>Instagram</label><input id=s1 value="${E(so.instagram||'')}"><label>TikTok</label><input id=s2 value="${E(so.tiktok||'')}"><label>Snapchat</label><input id=s3 value="${E(so.snapchat||'')}"><label>Facebook</label><input id=s4 value="${E(so.facebook||'')}">`)
 +acc('faq','Questions fréquentes (FAQ)',`${(S.faq||[]).map((x,i)=>`<div class=fq style="border-bottom:1px solid #1d3a18;padding-bottom:10px"><input class=q1 value="${E(x.q)}"><textarea class=a1 rows=3>${E(x.a)}</textarea><details class=sub><summary>Traductions EN / ES</summary><input class=qe placeholder="Question (EN)" value="${E(x.q_en||'')}"><textarea class=ae rows=2 placeholder="Réponse (EN)">${E(x.a_en||'')}</textarea><input class=qs2 placeholder="Pregunta (ES)" value="${E(x.q_es||'')}"><textarea class=as2 rows=2 placeholder="Respuesta (ES)">${E(x.a_es||'')}</textarea><input class=qr placeholder="Вопрос (RU)" value="${E(x.q_ru||'')}"><textarea class=ar rows=2 placeholder="Ответ (RU)">${E(x.a_ru||'')}</textarea></details><button class="d df" data-i=${i}>Supprimer</button></div>`).join('')}<button class=g id=af>+ Ajouter une question</button>`)
 +acc('pag','Pages (liens du pied de page)',`${(S.pages||[]).map((x,i)=>`<div class=pg style="border-bottom:1px solid #1d3a18;padding-bottom:10px"><label><input type=checkbox class=v2 style="width:auto" ${x.show?'checked':''}> Afficher</label><input class=t2 value="${E(x.title)}"><textarea class=x2 rows=5>${E(x.text)}</textarea><button class="d dp" data-i=${i}>Supprimer cette page</button></div>`).join('')}<button class=g id=ap>+ Ajouter une page</button>`)+'<button id=ss>Enregistrer</button>';
 const rs=(sel,fn)=>document.querySelectorAll(sel).forEach(x=>x.onclick=()=>{S=col();fn(+x.dataset.i);set()});
 $('#af').onclick=()=>{S=col();S.faq.push({q:'Nouvelle question',a:''});set()};rs('.df',i=>S.faq.splice(i,1));
 $('#ap').onclick=()=>{S=col();S.pages.push({title:'Nouvelle page',slug:'nouvelle-page',text:'',show:true});set()};rs('.dp',i=>S.pages.splice(i,1));
 $('#ar').onclick=()=>{S=col();S.google.reviews.push({name:'',rating:5,text:'',date:'',show:true});set()};rs('.dr',i=>S.google.reviews.splice(i,1));
 $('#ss').onclick=async()=>{const o=col(),f=$('#pi').files[0];if(f)o.popup.image=await img(f);await api('PUT','admin/settings',o);alert('Enregistré');render()}}
render();
</script></body></html>
